<!DOCTYPE HTML>

		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
			body {
				background-attachment: fixed, fixed;
			}

			.blog-container {
				max-width: 720px;
				margin: 2em auto;
				padding: 2em 2.5em;
				background: rgba(0, 0, 0, 0.62);
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 8px;
				color: #e8e8e8;
				font-size: 1.1em;
				line-height: 1.7;
			}

			@media (max-width: 768px) {
				.blog-container {
					margin: 0.5em;
					padding: 1.2em 1em;
					border-radius: 4px;
					font-size: 1em;
				}
			}

			.blog-header {
				border-bottom: 1px solid rgba(255, 255, 255, 0.2);
				margin-bottom: 1.5em;
				padding-bottom: 0.8em;
			}

			.blog-header h1 {
				color: #fff;
				font-size: 2.2em;
				line-height: 1.2;
				margin-bottom: 0.3em;
			}

			.blog-container a {
				color: #9fd3ff;
			}

			.blog-container a:hover {
				color: #fff;
			}

			.back-link {
				font-size: 0.9em;
				text-decoration: none;
			}

			.post-list {
				list-style: none;
				padding: 0;
				margin: 0;
			}

			.post-list li {
				padding: 0.6em 0;
				border-bottom: 1px solid rgba(255, 255, 255, 0.08);
			}

			.post-list li:last-child {
				border-bottom: 0;
			}

			.post-date {
				color: rgba(255, 255, 255, 0.6);
				font-size: 0.9em;
				margin-left: 0.5em;
			}

			.post-list a {
				font-size: 1.2em;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<div class="blog-container">
			<div class="blog-header">
				<p><a href="index.html" class="back-link">← Back to Home</a></p>

			<ul class="post-list">
